[project]
name = "expensetrackermcp"
version = "0.1.0"
description = "An MCP-powered expense tracker"
readme = "README.md"
authors = [
    { name = "Samriddh", email = "samriddhdas04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.8",
]

[project.scripts]
expensetrackermcp = "expensetrackermcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"